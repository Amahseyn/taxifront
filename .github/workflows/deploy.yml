name: Frontend Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend to server with SSH and PM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST || vars.SSH_HOST || '176.222.53.21' }}
          username: ${{ secrets.SSH_USER || vars.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            if [ ! -d "/var/www/taxifront/.git" ]; then
              mkdir -p /var/www
              git clone https://github.com/Amahseyn/taxifront.git /var/www/taxifront
            fi
            cd /var/www/taxifront
            git fetch origin main
            git reset --hard origin/main
            npm install
            NEXT_DISABLE_ESLINT=1 npm run build
            npx pm2 reload ecosystem.config.js --env production --only taxifront || npx pm2 start ecosystem.config.js --env production --only taxifront
            npx pm2 save


