name: Frontend Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend to server with SSH and PM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            if [ ! -d "/var/www/taxifront/.git" ]; then
              git clone https://github.com/Amahseyn/taxifront.git /var/www/taxifront
            fi
            cd /var/www/taxifront
            git pull origin main
            npm ci
            NEXT_DISABLE_ESLINT=1 npm run build
            npx pm2 start ecosystem.config.js --env production --only taxifront || npx pm2 reload ecosystem.config.js --env production --only taxifront
